name: RomRaider build

on: [push,pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64

      - name: Test Compiler
        run: javac -version

      # two Ant runs: build.xml sets the jar's class path property once per run
      - name: Build
        run: ant rebuild

      - name: Unit tests
        run: ant unittest
