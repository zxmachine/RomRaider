name: RomRaider build

on: [push,pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64

      - name: Test Compiler
        run: javac -version

      # two Ant runs: build.xml sets the jar's class path property once per run
      - name: Build
        run: ant rebuild

      - name: Unit tests
        run: ant unittest

      # JavaFX draws the diagrams of the table documentation panel; it is not in the repository
      - name: JavaFX
        shell: pwsh
        run: |
          $base = 'https://download2.gluonhq.com/openjfx/25.0.5'
          $files = @{
            'openjfx-25.0.5_windows-x64_bin-sdk.zip'   = 'fb7b9897164dc61100bebe21e6b639fc8becec18d7eed588fd17912d986e714c'
            'openjfx-25.0.5_windows-x64_bin-jmods.zip' = '41c0361e1183852a3693c5d505ed4aa914bb4190e0adc51ae4db28812a48d2ae'
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\javafx" | Out-Null
          foreach ($name in $files.Keys) {
            $file = "$env:RUNNER_TEMP\$name"
            Invoke-WebRequest "$base/$name" -OutFile $file
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $files[$name]) { throw "checksum of $name differs" }
            Expand-Archive $file -DestinationPath "$env:RUNNER_TEMP\javafx"
          }
          "JAVAFX_SDK=$env:RUNNER_TEMP\javafx\javafx-sdk-25.0.5" >> $env:GITHUB_ENV
          "JAVAFX_JMODS=$env:RUNNER_TEMP\javafx\javafx-jmods-25.0.5" >> $env:GITHUB_ENV

      # RomRaider.exe with its own Java runtime, built with JavaFX (package.xml)
      - name: Package
        run: ant -f package.xml

      - name: Upload the Windows package
        uses: actions/upload-artifact@v7
        with:
          name: RomRaider-windows-x64
          path: build/package/image
          if-no-files-found: error
